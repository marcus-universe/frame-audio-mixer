# Adds Frame Audio Mixer's own WirePlumber script. It does not disable or
# replace any other component, including steamos.microphone-tracker and
# Frame Mic Tuner's custom.frame-mic-tracker.
# Place: ~/.config/wireplumber/wireplumber.conf.d/91-frame-audio-mixer.conf

wireplumber.components = [
  {
    name = "@SCRIPT_PATH@",
    type = "script/lua",
    provides = "custom.frame-audio-mixer"
  }
]

wireplumber.profiles = {
  main = {
    "custom.frame-audio-mixer" = "required"
  }
}

# Steam and SteamVR play their interface sounds (a hover or a click in the
# dashboard) from Chromium helper processes that report the app name
# "Chromium". WirePlumber remembers a stream's target by app name, so a
# target stored for the Chromium browser would move them too: onto a mixer
# channel made for the browser. These streams keep no stored target.
stream.rules = [
  {
    matches = [
      { application.process.binary = "vrwebhelper" }
      { application.process.binary = "steamwebhelper" }
    ]
    actions = {
      update-props = {
        state.restore-target = false
      }
    }
  }
]

wireplumber.settings.schema = {
  frame-audio-mixer.enabled = {
    name = "Frame Audio Mixer"
    description = "Route the VRLink microphone through Frame Mic + Mix"
    type = "bool"
    default = false
  }
}
