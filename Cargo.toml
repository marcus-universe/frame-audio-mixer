[package]
name = "frame-audio-mixer"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "Mix app audio with the Steam Frame microphone for the PC wireless stream"
publish = false

[dependencies]
cairo-rs = { version = "0.20", default-features = false, features = ["freetype", "png"] }
freetype-rs = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
libc = "0.2"
memmap2 = "0.9"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
pipewire = { version = "0.10", features = ["v0_3_49"] }
libspa = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1

# The engine runs in PipeWire's realtime thread. A debug build of these
# crates starves the speaker period.
[profile.dev.package.pipewire]
opt-level = 3

[profile.dev.package.libspa]
opt-level = 3

[profile.dev.package.libspa-sys]
opt-level = 3

[profile.dev.package.pipewire-sys]
opt-level = 3

[lints.clippy]
# Rectangles are `draw::Rect` and the painter is `panel::Ui`, but a few drawing
# helpers still take a point, a size and several options side by side.
too_many_arguments = "allow"
# Self-tests and demos build configs by assigning onto a default.
field_reassign_with_default = "allow"
