[package]
name = "frame-vst-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Runs one VST3 plugin for Frame Audio Mixer, out of the engine's process"
publish = false

[[bin]]
name = "frame-vst-host"
path = "src/main.rs"

[dependencies]
vst3 = "0.3"
libloading = "0.8"
memmap2 = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
